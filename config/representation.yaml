# Official institutional sources used on party pages.  Party-specific seat
# figures belong under `parties:` only after they have been checked against
# the linked parliament or election authority.  The site deliberately shows
# an explicit verification-pending state instead of guessing or carrying a
# stale number forward.
checked_on: "2026-09-24"
european_parliament:
  label: European Parliament members
  url: "https://www.europarl.europa.eu/meps/en/search/advanced"

# Reusable, dated source records.  Party rows below add only the seat value and
# a caveat where a party's situation differs from the ordinary chamber count.
# For bicameral systems, the national card uses the directly elected lower
# chamber so figures remain comparable and unambiguous.
seat_templates:
  gr: &gr_current {total: 300, as_of: "2026-09-24", basis: "current parliamentary groups and affiliations", source: "https://www.hellenicparliament.gr/vouleftes/ana-koinovouleftiki-omada/"}
  de: &de_current {total: 630, as_of: "2026-09-24", basis: "21st Bundestag", source: "https://www.bundestag.de/en/parliament/plenary/distributionofseats"}
  fr: &fr_current {total: 577, as_of: "2026-09-24", basis: "current National Assembly groups or party affiliation", source: "https://www2.assemblee-nationale.fr/deputes/liste/groupe-politique"}
