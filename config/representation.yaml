# Official institutional sources used on party pages.  Party-specific seat
# figures belong under `parties:` only after they have been checked against
# the linked parliament or election authority.  The site deliberately shows
# an explicit verification-pending state instead of guessing or carrying a
# stale number forward.
checked_on: "2026-09-16"
european_parliament:
  label: European Parliament members
  url: "https://www.europarl.europa.eu/meps/en/search/advanced"

