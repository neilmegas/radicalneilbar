  ch: &ch_current {label: "National Council", total: 200, as_of: "2026-09-24", basis: "current lower-house party affiliation", source: "https://www.parlament.ch/en/ratsmitglieder"}
  is: &is_current {total: 63, as_of: "2026-09-24", basis: "current Althingi party affiliation", source: "https://www.althingi.is/altext/cv/en/"}
