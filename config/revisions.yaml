revisions:
  - date: "2026-09-24"
    title: "Party directory and political-power release (website 1.2)"
    changes:
      - "Standardised every party label strictly as English name / original-language name (acronym), including when the English and original names are identical."
      - "Restored the compact two-column party-list presentation while retaining country, family, parliamentary-power, search, filtering, and sorting controls; alphabetical order is the default."
      - "Added dated national-seat figures for every monitored party and a clearly labelled 2024 European-election delegation baseline for EU parties."
      - "Excluded contact, privacy, cookie, legal, accessibility, and sitemap utility pages from new collection and all published reports while preserving any old raw records for audit."
      - "Added website version 1.2 to the homepage and documented that routine report refreshes do not create a new website version."
      - "Applied a restrained site-wide visual refinement to navigation, typography, spacing, controls, lists, and research panels without changing the information architecture."
  - date: "2026-09-23"
    title: "Research-transparency and scholarly-tools release"
    changes:
      - "Added record-level provenance cards, report Research Passports, a source registry, translation-audit labels, and a prompt archive."
      - "Added validation, coverage, language-quality, collection-funnel, missing-data, and multidimensional-confidence dashboards."
      - "Added interactive comparison, longitudinal, quotation, cross-party event, election-series, figure-download, citation-manager, and replication tools."
      - "Added a correction workflow, usage tutorials, and a downloadable teaching sample."
      - "Added Συμμαχία Ελλήνων / Alliance of Greeks and verified symmaxia.net as its official website, with dedicated programme and parliamentary watch pages."
      - "Polished navigation, responsive controls, keyboard access, typography, and homepage wayfinding; added a restrictive browser connection policy so the public interface can load only first-party data."
  - date: "2026-09-16"
    title: "RAPPORT public research release"
    changes:
      - "Renamed the platform RAPPORT: Radicalism and Party Politics: Observation, Reporting and Tracking."
      - "Reorganised the menu into Reports, Explore, and Research dropdowns with standalone search."
      - "Added an enlarged Israel inset, clickable party links on the map, the Claude API disclosure, and www.neilbar.com."
      - "Added methodology, dataset/export, suggested-citation, collection-status, and stable-link documentation."
      - "Added party-page institutional links and source-gated representation panels; unverified figures are never guessed."
      - "Added report-level representation changes, four-week timelines, compact citation, CSV, and print/PDF controls."
      - "Expanded the roster to 65 parties in 20 countries after checking for active official websites."
  - date: "2026-09-16"
    title: "Interactive monitoring map"
    changes:
      - "Reworked the front page around a geographic overview of the monitored countries and parties."
      - "Added mouse, keyboard, and touch interaction that reveals every monitored party in a selected country."
      - "Added a research-purpose statement, creator credit for Dr. Neil Bar, and an obfuscated contact address."
  - date: "2026-09-16"
    title: "Roster expanded to 43 parties"
    changes:
      - "Added 16 requested parties across Cyprus, Denmark, Germany, Ireland, Israel, Italy, the Netherlands, Norway, Portugal, Greece, and the United Kingdom; Greek Solution and Podemos were already monitored and were not duplicated."
      - "Standardised every public camp label and CSV export to the two terms far-left and far-right."
      - "Added official party websites and local-language discovery terms for every new roster entry."
  - date: "2026-09-16"
    title: "Action-focused reports and archive tools"
    changes:
      - "Added The week in one minute, evidence-linked watchpoints, and a comparison with the preceding archived week."
      - "Added observable action-type labels without restoring retired ideological theme tags."
      - "Added party-by-party collection coverage that separates quiet checks, access failures, outside reporting, and missing logs."
      - "Added party activity timelines, full-text archive search, two-week comparison, and original-language display controls."
      - "Published this methodology page and revision log."
  - date: "2026-09-15"
    title: "Evidence-first report redesign"
    changes:
      - "Made the publication an evidence-first weekly party monitor."
      - "Made direct party documents the central evidence and condensed other reporting into linked context."
      - "Added weekly highlights, world context, reading recommendations, and collapsible country, party, and review sections."
      - "Removed the former Israel, antisemitism, and immigration theme presentation."
      - "Added the Da'am Workers Party to the monitored roster."
