name: 5 · Historical collection

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: "First date (YYYY-MM-DD)"
        required: true
        default: "2023-01-01"
        type: string
      to_date:
        description: "Last date (YYYY-MM-DD); start with one month"
        required: true
        default: "2023-01-31"
        type: string
      parties:
        description: "Optional party IDs, comma-separated; blank means all"
        required: false
        type: string
      countries:
        description: "Optional country codes, comma-separated; blank means all"
        required: false
        type: string
      interpretation:
        description: "Add detailed AI interpretation (slower and costs more)"
        required: true
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"

permissions:
  contents: write

concurrency:
  group: monitoring-data
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Collect and analyse the requested dates
        env:
          FROM_DATE: ${{ inputs.from_date }}
          TO_DATE: ${{ inputs.to_date }}
          PARTIES: ${{ inputs.parties }}
          COUNTRIES: ${{ inputs.countries }}
          WITH_INTERPRETATION: ${{ inputs.interpretation }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          args=(backfill --from "$FROM_DATE" --to "$TO_DATE")
          if [ -n "$PARTIES" ]; then
            IFS=',' read -ra values <<< "$PARTIES"
            for value in "${values[@]}"; do
              value="${value#${value%%[![:space:]]*}}"
              value="${value%${value##*[![:space:]]}}"
              [ -z "$value" ] || args+=(--party "$value")
            done
          fi
          if [ -n "$COUNTRIES" ]; then
            IFS=',' read -ra values <<< "$COUNTRIES"
            for value in "${values[@]}"; do
              value="${value#${value%%[![:space:]]*}}"
              value="${value%${value##*[![:space:]]}}"
              [ -z "$value" ] || args+=(--country "$value")
            done
          fi
          [ "$WITH_INTERPRETATION" != "yes" ] || args+=(--with-interpretation)
          python run.py "${args[@]}"

      - name: Save the historical data and rebuilt website
        shell: bash
        run: |
          git config user.name "radical-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/items.db site
          for path in snapshots exports; do
            [ ! -e "$path" ] || git add -f "$path"
          done
          git diff --staged --quiet || git commit -m "Historical collection ${{ inputs.from_date }} to ${{ inputs.to_date }}"
          git push
