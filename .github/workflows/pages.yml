name: 0 · Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["2 · Weekly issue", "3 · Monthly refresh", "4 · Daily watch"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Verify RAPPORT update consistency
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import inspect
          import yaml
          from portal import issue_page

          with open("config/sources.yaml", encoding="utf-8") as handle:
              parties = yaml.safe_load(handle).get("parties") or []
          party_ids = {party.get("id") for party in parties}
          required = {
              "symmachiaellinon", "forzanuova", "poterealpopolo", "rifondazione",
              "daam", "zehut", "fvd", "pvdd", "denk", "akel", "elam",
              "bsw", "dielinke", "greenparty", "reformuk", "lega", "syriza",
              "podemos", "bloco", "roedt", "enhedslisten", "pbp",
          }
          missing = sorted(required - party_ids)
          if len(parties) != 69 or missing:
              raise SystemExit(
                  "Incomplete config upload: expected 69 parties; "
                  f"found {len(parties)}. Missing required IDs: {missing}"
              )
          if "research" not in inspect.signature(issue_page).parameters:
              raise SystemExit(
                  "Incomplete src upload: src/portal.py is from an older release."
              )
          print("Consistency check passed: 69 parties and matching report generator.")
          PY

      - name: Build website
        run: |
          if [ -f data/items.db ]; then
            python run.py site
          else
            echo "No database yet; publishing the safe sample website."
            python run.py demo
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
